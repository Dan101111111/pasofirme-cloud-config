spring.application.name=servicio-zapatos
server.port=18761

spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/zapatos_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=America/Bogota

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.defaultZone=http://localhost:18760/eureka/

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
