spring.application.name=pasarela-gateway
server.port=18080

spring.profiles.default=local

spring.cloud.gateway.server.webmvc.routes[0].id=ruta-zapatos
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://servicio-zapatos
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/zapatos,/api/zapatos/**

eureka.client.service-url.defaultZone=http://localhost:18760/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
