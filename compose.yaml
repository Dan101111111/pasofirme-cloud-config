services:
  mysql:
    image: mysql:8.4.3
    container_name: pasofirme-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zapatos_db}
      MYSQL_USER: ${MYSQL_USER:-zapatos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pasofirme-net
    healthcheck:
      test: ["CMD-SHELL", "mysql -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1;' $${MYSQL_DATABASE} > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  mysql_data:
    name: pasofirme_mysql_data

networks:
  pasofirme-net:
    name: pasofirme-net
