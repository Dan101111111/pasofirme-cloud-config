$kind: http-request
name: 05d - PATCH /api/zapatos
description: Intento de modificación parcial PATCH con JSON válido. Debe responder 405.
url: "{{baseUrl}}/api/zapatos"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "marca": "Intento PATCH"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 405 Method Not Allowed", function () {
          pm.response.to.have.status(405);
      });
    language: text/javascript
order: 4000
