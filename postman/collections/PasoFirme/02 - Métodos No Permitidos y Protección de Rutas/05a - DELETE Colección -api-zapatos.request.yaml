$kind: http-request
name: 05a - DELETE Colección /api/zapatos
description: Intento de borrado masivo sobre /api/zapatos. Debe responder 405.
url: "{{baseUrl}}/api/zapatos"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
