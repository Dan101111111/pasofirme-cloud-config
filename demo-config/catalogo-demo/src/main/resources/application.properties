# Identidad y puerto de catalogo-demo
spring.application.name=catalogo-demo
server.port=18881
spring.profiles.active=${DEMO_PROFILE:dev}

# Importacion estricta de Spring Cloud Config Data (falla de inmediato si el servidor no esta disponible: sin optional:)
spring.cloud.config.label=main
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:18888}

# Exposicion tecnica minima en Actuator (health y refresh)
management.endpoints.web.exposure.include=health,refresh
management.endpoint.health.show-details=always
management.info.env.enabled=false

