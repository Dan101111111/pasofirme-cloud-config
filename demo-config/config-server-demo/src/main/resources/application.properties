# Identidad y puerto del Config Server
spring.application.name=config-server-demo
server.port=18888

# Desactivar la busqueda de configuracion remota para el propio Config Server
spring.cloud.config.enabled=false

# Repositorio Git remoto oficial de PasoFirme
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/Dan101111111/pasofirme-config-repo.git}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.try-master-branch=false
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=0

# Exposicion tecnica minima en Actuator (unicamente health)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.info.env.enabled=false

